<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Remote desktop</title>
    <script>
      const target = new URL('vnc.html', window.location.href);
      target.searchParams.set('autoconnect', 'true');
      target.searchParams.set('resize', 'remote');
      target.searchParams.set('path', 'websockify');
      // Force a stable base path for Render-hosted HTTPS deployments.
      const current = window.location.href;
      const wsBase = new URL('/websockify', window.location.origin);
      const pathInput = document.createElement('input');
      pathInput.name = 'path';
      pathInput.value = 'websockify';
      // Set the browser location immediately.
      window.location.replace(target.toString());
    </script>
  </head>
  <body>
    Opening the remote desktop…
    <a href="vnc.html?autoconnect=true&resize=remote&path=websockify">Continue</a>
  </body>
</html>
